
worker_processes  1;


events {
    worker_connections  1024;
}


http {
    #include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;

    keepalive_timeout  65;


    proxy_cache_path ${NGINX_CACHE_DIR} levels=1:2 keys_zone=download_cache:10m max_size=10g inactive=60m use_temp_path=off;

    server {
        listen       80;
        server_name  www.hitran.org hitran.org localhost;
        return 301 https://$host$request_uri; # Redirects automatically
    }

    # HTTPS server

    server {
       listen       443 ssl;
       server_name  www.hitran.org;

       ssl_certificate      ../../cert.pem;
       ssl_certificate_key  ../../cert.key;

       ssl_session_cache    shared:SSL:1m;
       ssl_session_timeout  5m;

       ssl_ciphers  HIGH:!aNULL:!MD5;
       ssl_prefer_server_ciphers  on;

	   return 301 https://hitran.org$request_uri;
    }

    server {
       listen       443 ssl;
       server_name  hitran.org;

       ssl_certificate      ../../cert.pem;
       ssl_certificate_key  ../../cert.key;

       ssl_session_cache    shared:SSL:1m;
       ssl_session_timeout  5m;

       ssl_ciphers  HIGH:!aNULL:!MD5;
       ssl_prefer_server_ciphers  on;

       location / {

		   # Force NGINX to bypass /etc/hosts using public DNS
		   resolver 8.8.8.8 valid=300s;
           set $upstream_endpoint https://hitran.org;
           proxy_pass $upstream_endpoint;
		   proxy_ssl_server_name on;
		   proxy_set_header Host hitran.org;

		   proxy_set_header X-Forwarded-Proto https;
		   proxy_set_header X-Forwarded-Host $host;
		   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

		   proxy_cache_lock on;
           proxy_cache_lock_age 30s;

           proxy_cache download_cache;

		   proxy_cache_valid 200 7d; # Caches successful downloads for 7 days

           add_header X-Cache-Status $upstream_cache_status;
           add_header X-Served-By "My-Nginx-Proxy";
       }
	   location /login/ {

		   # Force NGINX to bypass /etc/hosts using public DNS
		   resolver 8.8.8.8 valid=300s;
           set $upstream_endpoint https://hitran.org;
           proxy_pass $upstream_endpoint;
		   proxy_ssl_server_name on;
		   proxy_set_header Host hitran.org;

		   proxy_set_header X-Forwarded-Proto https;
		   proxy_set_header X-Forwarded-Host $host;
		   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

		   proxy_cache off;
       }
    }
}

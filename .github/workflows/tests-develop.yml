# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests on develop

on:
  push:
    branches: [ "develop" ] #see python-package-master.yml for tests on master
  pull_request:
    branches: [ "develop" ]

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache downloaded databases
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/nginx_cache
          # Using a unique run key, this first job will always miss the cache, re-download, and store the new cache
          key: hitran-cache-${{ github.run_id }}-${{ github.run_attempt }}
      # - name: Install dependencies
        # run: |
          # python -m pip install --upgrade pip
          # python -m pip install pytest specutils
          # pip install -e .
      - name: Set-up proxy server
        run: | # generate SSL certificates, run server in the background, and reroute hitran traffic to the proxy
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 -subj "/CN=www.hitran.org" -keyout cert.key -out cert.pem -addext "subjectAltName = DNS:www.hitran.org,DNS:localhost,IP:127.0.0.1"
          sudo nginx -c ${{ github.workspace }}/.github/proxy/nginx_dbm.conf &
          echo "REQUESTS_CA_BUNDLE=${{ github.workspace }}/cert.pem" >> $GITHUB_ENV
          ${{ runner.os != 'Windows' && 'sudo ' || '' }}python .github/proxy/append_hosts.py

      - name: Test database fetching
        env:
          HITRAN_EMAIL: ${{ secrets.HITRAN_EMAIL }}
          HITRAN_PASSWORD: ${{ secrets.HITRAN_PASSWORD }}
        run: |
          pip install requests
          python .github/proxy/test_proxy.py
        #  pytest -m "needs_connection and not download_large_databases" --durations=10 --tb=short
      - name: Copy proxy cache to Github cache
        run: |
          sudo mkdir -p ${{ github.workspace }}/nginx_cache/
          sudo cp -a /var/cache/nginx/. ${{ github.workspace }}/nginx_cache/
          sudo chown -R runner:docker ${{ github.workspace }}/nginx_cache

  build:
    env:
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      # max-parallel: 3
      matrix:
        include:
          # Try only the oldest and latest supported versions of Python on develop, to speed up the tests. We test more versions on master (see python-package-master.yml)
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13" #added to test the behavior without vaex (compatible up to 3.12)
          #For windows and macOS, we test only the Python 3.12, to speed up the tests.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}

    needs: fetch # Forces completion of the downloads & caching first

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Github cache download
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/nginx_cache
          key: hitran-cache-${{ github.run_id }}-${{ github.run_attempt }}
      # - name: Install dependencies
        # run: |
          # python -m pip install --upgrade pip
          # python -m pip install pytest specutils pytest-cov
          # pip install -e .
      - name: Copy Github cache to proxy cache
        run: |
          sudo mkdir -p /var/cache/nginx
          tar -C ${{ github.workspace }}/nginx_cache -cf - . | sudo tar -C /var/cache/nginx -xf -
          sudo chmod -R 777 /var/cache/nginx
      - name: Set-up proxy server
        run: | # generate SSL certificates, run server in the background, and reroute hitran traffic to the proxy
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 -subj "/CN=www.hitran.org" -keyout cert.key -out cert.pem -addext "subjectAltName = DNS:www.hitran.org,DNS:localhost,IP:127.0.0.1"
          sudo nginx -c ${{ github.workspace }}/.github/proxy/nginx_dbm.conf &
          echo "REQUESTS_CA_BUNDLE=${{ github.workspace }}/cert.pem" >> $GITHUB_ENV
          ${{ runner.os != 'Windows' && 'sudo ' || '' }}python .github/proxy/append_hosts.py

      - name: Test Proxy
        run: |
          pip install requests
          python .github/proxy/test_proxy.py

      # - name: Fast tests with pytest
        # run: |
          # pytest -m "fast and not needs_db_CDSD_HITEMP_PCN and not needs_db_CDSD_HITEMP and not needs_db_CDSD_HITEMP_PC and not needs_gpu and not needs_HITRAN_credentials" --durations=10 --cov=radis --cov-config=setup.cfg --cov-report=xml:coverage.xml
      # - name: Long tests with pytest
        # if: always()
        # run: |
          # pytest -m "not fast and not needs_cuda and not download_large_databases and not needs_db_CDSD_HITEMP and not needs_db_CDSD_HITEMP_PCN and not needs_db_CDSD_HITEMP_PC and not needs_db_HITEMP_CO2_DUNHAM and not needs_db_HITEMP_CO_DUNHAM and not needs_gpu and not needs_HITRAN_credentials" --durations=10 --cov=radis --cov-config=setup.cfg --cov-report=xml:coverage.xml --cov-append
      # - name: Upload coverage to Codecov
        # uses: codecov/codecov-action@v4
        # if: always()
        # with:
          # token: ${{ secrets.CODECOV_TOKEN }}
          # slug: radis/radis
          # files: ./coverage.xml
          # flags: unittests
          # name: codecov-umbrella
          # fail_ci_if_error: false

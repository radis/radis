name: Issue assign command

on:
  issue_comment:
    types: [created]

env:
  MAX_ASSIGNMENTS: 2

jobs:
  handle-command:
    if: >-
      github.event.issue.pull_request == null &&
      (startsWith(github.event.comment.body, '/assign') ||
       startsWith(github.event.comment.body, '/unassign'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Handle assign command
        uses: actions/github-script@v7
        env:
          MAX_ASSIGNMENTS: ${{ env.MAX_ASSIGNMENTS }}
        with:
          script: |
            const body = context.payload.comment.body.trim().toLowerCase();
            const user = context.payload.comment.user.login;
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const issueNumber = issue.number;
            const maxAssignments = parseInt(process.env.MAX_ASSIGNMENTS);

            async function comment(msg) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber, body: msg,
              });
            }

            // Check if user is a maintainer (admin/maintain/write → bypass limits)
            const { data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: user,
            });
            const isMaintainer = ['admin', 'write', 'maintain'].includes(permission);

            // --- /unassign ---
            if (body.startsWith('/unassign')) {
              const assigned = issue.assignees.map(a => a.login);
              if (!assigned.includes(user)) {
                await comment(`@${user} You are not assigned to this issue.`);
                return;
              }
              await github.rest.issues.removeAssignees({
                owner, repo, issue_number: issueNumber, assignees: [user],
              });
              await comment(`Unassigned @${user} from this issue.`);
              return;
            }

            // --- /assign ---
            if (!body.startsWith('/assign')) return;

            // Check if user has at least one merged PR (maintainers bypass)
            if (!isMaintainer) {
              const { data: mergedSearch } = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} type:pr is:merged author:${user}`,
                per_page: 1,
              });
              if (mergedSearch.total_count === 0) {
                await comment(
                  `@${user} The \`/assign\` command is available to contributors ` +
                  `with at least one merged PR in this repository. ` +
                  `Please ask a maintainer to assign you manually.`
                );
                return;
              }
            }

            // Check if issue is already assigned
            if (issue.assignees.length > 0) {
              const current = issue.assignees.map(a => `@${a.login}`).join(', ');
              await comment(`@${user} This issue is already assigned to ${current}.`);
              return;
            }

            // Check max assignments (maintainers bypass)
            if (!isMaintainer) {
              const { data: assigned } = await github.rest.issues.listForRepo({
                owner, repo, assignee: user, state: 'open', per_page: 100,
              });
              const assignedIssues = assigned.filter(i => !i.pull_request);
              if (assignedIssues.length >= maxAssignments) {
                await comment(
                  `@${user} You already have ${assignedIssues.length} open issue(s) assigned. ` +
                  `The limit is ${maxAssignments}. Please finish or \`/unassign\` before taking new ones.`
                );
                return;
              }
            }

            // Assign
            await github.rest.issues.addAssignees({
              owner, repo, issue_number: issueNumber, assignees: [user],
            });
            await comment(`Assigned @${user} to this issue.`);

name: Linting with pre-commit

on:
  push:
    branches: [ "develop", "master" ] #see python-package-master.yml for tests on master
  pull_request:
    branches: [ "develop" ]
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pre-commit environments
      uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        # Use the exact installed version (e.g. 3.10.18), not the matrix one, so
        # the cache is rebuilt when the runner's Python patch version changes.
        key: pre-commit-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit
    - name: Analysing the code with pre-commit
      run: |
        pre-commit run --all-files --show-diff-on-failure
